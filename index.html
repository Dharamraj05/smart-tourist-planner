        }

            color: white;
        }

        .content {

            margin-bottom: 30px;

            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

            border-radius: 8px;
            font-size: 16px;

            border-radius: 8px;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

                    (position) => {
                        userCoords = [position.coords.latitude, position.coords.longitude];
                        document.getElementById('currentLocation').value = `Lat: ${userCoords[0].toFixed(2)}, Lon: ${userCoords[1].toFixed(2)}`;
                        alert('✅ Location detected!');
                    },
                    (error) => {
                        alert('❌ Location access denied. Using default.');
                        document.getElementById('currentLocation').value = 'New Delhi, India';
                        userCoords = [28.6139, 77.2090];
                    }
                );
            } else {
                alert('❌ Geolocation not supported');
                userCoords = [28.6139, 77.2090];
            }
        }

        function initMap(destination, attractions, userLat, userLon) {
            const destCoords = cityCoords[destination];
            const centerLat = (userLat + destCoords[0]) / 2;
            const centerLon = (userLon + destCoords[1]) / 2;
            
            if (map) map.remove();
            
            map = L.map('map').setView([centerLat, centerLon], 3);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            const userIcon = L.divIcon({
                html: '<div style="background: #28a745; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">📍</div>',
                className: '',
                iconSize: [35, 35]
            });

            const destIcon = L.divIcon({
                html: '<div style="background: #dc3545; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">🎯</div>',
                className: '',
                iconSize: [35, 35]
            });

            L.marker([userLat, userLon], {icon: userIcon}).addTo(map).bindPopup('<b>📍 Your Location</b>');
            L.marker(destCoords, {icon: destIcon}).addTo(map).bindPopup(`<b>🎯 ${destination}</b>`);
            L.polyline([[userLat, userLon], destCoords], {
                color: '#667eea',
                weight: 4,
                opacity: 0.7,
                dashArray: '10, 10'
            }).addTo(map);

            const coords = attractionCoords[destination];
            coords.forEach((coord, i) => {
                if (i < attractions.length) {
                    const attrIcon = L.divIcon({
                        html: `<div style="background: #667eea; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">${i+1}</div>`,
                        className: '',
                        iconSize: [28, 28]
                    });
                    
                    L.marker(coord, {icon: attrIcon}).addTo(map).bindPopup(`<b>${i+1}. ${attractions[i]}</b>`);
                }
            });

            const bounds = L.latLngBounds([[userLat, userLon], destCoords]);
            coords.forEach(coord => bounds.extend(coord));
            map.fitBounds(bounds, {padding: [50, 50]});
        }

        function analyzeRoute(distance, attractions) {
            const insights = [];
            const duration = distance / 800;
            
            if (distance > 10000) {
                insights.push("🛫 Long-haul flight recommended - Book 2-3 months ahead");
                insights.push(`✈️ Flight time: ~${duration.toFixed(1)} hours`);
            } else if (distance > 2000) {
                insights.push("✈️ International flight - Check visa requirements");
                insights.push(`⏱️ Travel time: ${duration.toFixed(1)} hours`);
            } else if (distance > 500) {
                insights.push("🚄 Train or regional flight options available");
            } else {
                insights.push("🚗 Perfect for road trip!");
            }

            if (attractions > 5) {
                insights.push("📸 Plan at least 3 days for all attractions");
            }

            insights.push("🤖 Route optimized using Dijkstra's shortest path algorithm");
            
            return insights;
        }

        async function generatePlan() {
            const destination = document.getElementById('destination').value;
            const days = parseInt(document.getElementById('days').value);
            const members = parseInt(document.getElementById('members').value);
            const budget = parseInt(document.getElementById('budget').value);

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Generating Plan...';

            const userLat = userCoords ? userCoords[0] : 28.6139;
            const userLon = userCoords ? userCoords[1] : 77.2090;

            try {
                const response = await fetch(`${API_URL}/generatePlan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destination, days, members, budget })
                });

                if (!response.ok) throw new Error('Server error');

                const data = await response.json();
                currentPlanData = { ...data, members, days, budget };

                document.getElementById('results').classList.add('active');
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

                const destCoords = cityCoords[destination];
                const distance = calculateDistance(userLat, userLon, destCoords[0], destCoords[1]);

                initMap(destination, data.route.path, userLat, userLon);

                const insights = analyzeRoute(distance, data.route.path.length);
                displayAIAnalysis(distance, insights);
                displayRoute(data.route);
                displayItinerary(data.itinerary);
                displayHotels(data.hotels, data.costs, destination);
                displayCosts(data.costs, budget);

            } catch (error) {
                alert('❌ Backend error! Ensure MongoDB is running:\n\n1. Start MongoDB\n2. Run: node server.js\n3. Server should be on port 5000');
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Generate AI-Optimized Plan';
            }
        }

        function displayAIAnalysis(distance, insights) {
            document.getElementById('aiAnalysis').innerHTML = `
                <div class="ai-badge">🤖 AI Route Analysis</div>
                <h3 style="margin-bottom: 15px;">Shortest Distance</h3>
                <div style="font-size: 2.2em; font-weight: bold; margin-bottom: 10px;">
                    ${distance.toFixed(0)} km
                </div>
                <div style="background: rgba(255,255,255,0.2); padding: 20px; border-radius: 8px;">
                    <strong style="font-size: 1.1em;">💡 Insights:</strong>
                    <ul style="margin-top: 15px; list-style-position: inside; line-height: 1.8;">
                        ${insights.map(insight => `<li style="margin: 10px 0;">${insight}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        function displayRoute(route) {
            document.getElementById('routeInfo').innerHTML = `
                <div class="route-stat">
                    <div class="value">${route.path.length}</div>
                    <div class="label">Attractions</div>
                </div>
                <div class="route-stat">
                    <div class="value">${route.distance.toFixed(1)}</div>
                    <div class="label">Route Distance (km)</div>
                </div>
                <div class="route-stat">
                    <div class="value">${Math.ceil(route.distance / 5)}</div>
                    <div class="label">Travel Hours</div>
                </div>
            `;

            document.getElementById('pathViz').innerHTML = route.path.map((node, i) => {
                if (i === route.path.length - 1) return `<div class="path-node">${node}</div>`;
                return `<div class="path-node">${node}</div><div class="path-arrow">→</div>`;
            }).join('');
        }

        function displayItinerary(itinerary) {
            document.getElementById('itinerary').innerHTML = itinerary.map(day => `
                <div class="itinerary-day">
                    <div class="day-header">Day ${day.day}</div>
                    ${day.activities.map(act => `
                        <div class="activity">
                            <div class="activity-time">${act.time}</div>
                            <div class="activity-details">
                                <strong>${act.title}</strong><br>
                                <span style="color: #666;">Duration: ${act.duration_hours} hours</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function displayHotels(hotels, costs, destination) {
            document.getElementById('hotels').innerHTML = costs.hotelCosts.map(hotelCost => {
                const hotel = hotels.find(h => h.name === hotelCost.name);
                const isRecommended = hotelCost.name === costs.recommended.name;
                
                return `
                    <div class="hotel-card ${isRecommended ? 'recommended' : ''}">
                        ${isRecommended ? '<div class="recommended-badge">✨ Best Value</div>' : ''}
                        <div class="hotel-name">${hotelCost.name}</div>
                        <div class="hotel-rating">${'⭐'.repeat(hotelCost.rating)}</div>
                        <div class="hotel-amenities">
                            ${hotelCost.amenities.map(a => `<span class="amenity">${a}</span>`).join('')}
                        </div>
                        <div class="hotel-price">$${hotelCost.total}</div>
                        <div style="color: #666; margin-bottom: 15px;">
                            ${costs.roomsNeeded} room(s) × ${currentPlanData.days} night(s)<br>
                            <strong>${hotelCost.perPerson.toFixed(2)}/person</strong>
                        </div>
                        <button class="btn-book" onclick="bookHotel('${hotelCost.name}', '${destination}', ${hotelCost.total})">
                            Book Now
                        </button>
                    </div>
                `;
            }).join('');
        }

        function displayCosts(costs, budgetPerPerson) {
            const totalBudget = budgetPerPerson * costs.members;
            const withinBudget = costs.recommended.total <= totalBudget;
            const difference = Math.abs(totalBudget - costs.recommended.total);

            document.getElementById('costSummary').innerHTML = `
                <h3 style="margin-bottom: 20px;">💰 Trip Cost Summary</h3>
                <div class="cost-row">
                    <span>Group Size</span>
                    <span>${costs.members} members</span>
                </div>
                <div class="cost-row">
                    <span>Rooms Needed</span>
                    <span>${costs.roomsNeeded} rooms</span>
                </div>
                <div class="cost-row">
                    <span>Recommended Hotel</span>
                    <span>${costs.recommended.name}</span>
                </div>
                <div class="cost-row">
                    <span>Accommodation (${costs.roomsNeeded} rooms)</span>
                    <span>${costs.recommended.total}</span>
                </div>
                <div class="cost-total">
                    <div class="cost-row">
                        <span>Total Budget</span>
                        <span>${totalBudget}</span>
                    </div>
                    <div class="cost-row" style="border: none;">
                        <span>Per Person</span>
                        <span>${(costs.recommended.total / costs.members).toFixed(2)}</span>
                    </div>
                </div>
                ${withinBudget ? 
                    `<div style="background: rgba(40, 167, 69, 0.3); padding: 15px; border-radius: 8px; margin-top: 15px;">
                        ✅ Within budget! You save ${difference.toFixed(2)}
                    </div>` : 
                    `<div style="background: rgba(220, 53, 69, 0.3); padding: 15px; border-radius: 8px; margin-top: 15px;">
                        ⚠️ Over budget by ${difference.toFixed(2)}
                    </div>`
                }
            `;
        }

        async function bookHotel(hotelName, destination, totalCost) {
            if (!currentPlanData) {
                alert('❌ Please generate a plan first');
                return;
            }

            const { members, days } = currentPlanData;
            const rooms = Math.ceil(members / 2);

            try {
                const response = await fetch(`${API_URL}/book-hotel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        hotelName,
                        destination,
                        members,
                        days,
                        rooms,
                        totalCost
                    })
                });

                if (!response.ok) throw new Error('Booking failed');

                const data = await response.json();
                showConfirmation(data.confirmation);

                // Optionally save trip to database
                await fetch(`${API_URL}/save-trip`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        destination,
                        days,
                        members,
                        budget: currentPlanData.budget,
                        itinerary: currentPlanData.itinerary,
                        route: currentPlanData.route
                    })
                });

            } catch (error) {
                alert('❌ Booking failed! Make sure the backend is running.');
                console.error(error);
            }
        }

        function showConfirmation(confirmation) {
            document.getElementById('confirmationDetails').innerHTML = `
                <p><strong>🎫 Booking ID:</strong> ${confirmation.bookingId}</p>
                <p><strong>🏨 Hotel:</strong> ${confirmation.hotelName}</p>
                <p><strong>📍 Destination:</strong> ${confirmation.destination}</p>
                <p><strong>👥 Members:</strong> ${confirmation.members}</p>
                <p><strong>📅 Days:</strong> ${confirmation.days}</p>
                <p><strong>✅ Status:</strong> ${confirmation.status}</p>
                <p><strong>🕒 Booked:</strong> ${new Date(confirmation.timestamp).toLocaleString()}</p>
            `;
            document.getElementById('confirmationModal').classList.add('active');
        }

        function closeConfirmation() {
            document.getElementById('confirmationModal').classList.remove('active');
        }
    </script>
</body>
</html>
